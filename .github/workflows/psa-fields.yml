name: PSA Pop Fields

on:
  workflow_dispatch:

jobs:
  fields:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dump full GetPSASpecPopulation response
        env:
          PSA_API_TOKEN: ${{ secrets.PSA_API_TOKEN }}
        run: |
          AUTH="authorization: bearer $PSA_API_TOKEN"
          curl -s --max-time 25 "https://api.psacard.com/publicapi/pop/GetPSASpecPopulation/5994963" -H "$AUTH" -o /tmp/p.json
          echo "=== Full raw JSON ==="
          python3 -m json.tool /tmp/p.json
